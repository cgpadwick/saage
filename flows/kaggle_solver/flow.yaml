# Kaggle solver: hill-climbing on an mle-bench competition.
# Port of mle-beast's benchmark pipeline (docs/kaggle_solver_plan.md §5):
#
#   prepare(cmd) -> setup(cmd: git branch + ledger)
#     -> comp_understanding -> eda          (agent+critic retry_loops)
#     -> build_baseline (agent; DETERMINISTIC pytest smoke check)
#     -> baseline short-train (cmd, fixed budget) -> verify -> record
#     -> hillclimb counting_loop:
#          [propose -> critic]x3 -> [implement -> pytest]x3
#          -> reset -> train(cmd) -> verify -> keep_or_revert(cmd)
#        exits on consecutive failures or target met
#     -> final train (cmd, long budget) -> make_submission (agent;
#        DETERMINISTIC validate_submission.py check) -> report -> grade
#
# The validation score driving keep/revert comes from eval_results.json
# (train.py contract) — a deterministic capture, never LLM log-reading.
# Deterministic checks (pytest, submission validation) use command-step
# ACTION routing (E2).
#
# Run (after `mlebench prepare -c <comp> --data-dir ~/.mlebench/data`):
#   OPENROUTER_API_KEY=... saage run flows/kaggle_solver/flow.yaml \
#     --workspace /tmp/kaggle_run --set competition_id=spooky-author-identification
# brains on the strong tier; mechanical judgment steps override to flash via
# per-step `model:` (E3) — ~5x cheaper where quality doesn't move the score
provider: { type: openrouter, model: deepseek/deepseek-v4-pro }
workspace: /tmp/saage_kaggle
# what the remote sidecar collects from the workspace (local runs ignore this).
# This list is also what a cross-box `saage remote resume` can restore, so it
# must cover everything the hillclimb needs to continue on a fresh box: the
# solution code + best checkpoint, not just the ledgers — and the submission +
# grading output so a finished run can be audited from the mirror alone.
artifacts: [experiments.jsonl, research_log.md, report.html,
            submission.csv, eval_results.json, grading_submission.jsonl,
            competition_understanding.md, data_analysis.md,
            model.py, train.py, predict.py, "checkpoints/best_model.*"]
shared:
  competition_id: spooky-author-identification
  mlebench_data_dir: "$HOME/.mlebench/data"   # shell-expanded in commands
  device: cpu                  # overwritten by prepare's DEVICE capture
  device_override: ""          # set to cpu/cuda to skip auto-detection
  metric_name: "the competition metric"   # refined by agents from the description
  lower_is_better: false       # SET THIS PER COMPETITION (true for RMSE/logloss)
  target_score: ""             # optional early-exit score
  short_epochs: 15             # fixed exploratory budget per experiment
  final_epochs: 100            # final training (early stopping decides actual)
  outer_phases: 6              # MLE-STAR outer loop: ablation-picked targets
  inner_iterations: 5          # experiments per target (6×5 = 30 total)
  max_consecutive_failures: 10
  target_block: ""             # set each phase by the ablation step
  best_score: "nan"            # sentinels: nan never wins a comparison
  candidate_score: "nan"
  consecutive_failures: 0
  target_met: 0
  sample_submission_cols: ""
  sample_submission_rows: 0
  run_branch: ""               # remote handoffs pass the run branch
  current_proposal: ""

workflow:
  # ---- stage the competition + git/ledger setup ----
  - id: prepare
    type: command
    run: 'python3 "{{ flow_dir }}/prepare_comp.py" --comp {{ competition_id }} --data-dir "{{ mlebench_data_dir }}" --device "{{ device_override }}"'
    set:
      sample_submission_cols: "SAMPLE_COLS=(.*)"
      sample_submission_rows: "SAMPLE_ROWS=([0-9]+)"
      device: "DEVICE=(\\S+)"
  - id: setup
    type: command
    run: 'python3 "{{ flow_dir }}/setup_competition.py" --comp {{ competition_id }} --metric "{{ metric_name }}" --lower-is-better {{ lower_is_better }} --short-epochs {{ short_epochs }} --final-epochs {{ final_epochs }} --branch "{{ run_branch }}"'
  # cross-competition memory (P5): distilled outcomes of past graded runs,
  # written into the flow dir by `bench.py collect`, staged for the agents.
  # No-ops harmlessly when the flow has no memory yet.
  - id: stage_memory
    type: command
    run: 'mkdir -p memory && cp "{{ flow_dir }}/memory/"*.md memory/ 2>/dev/null; ls memory/ 2>/dev/null || true'

  # ---- understand, then EDA (agent + critic vetting) ----
  - id: understand_loop
    type: retry_loop
    max_iterations: 3
    action: { id: comp_understanding, type: agent, skill: comp_understanding, max_steps: 30 }
    check:  { id: comp_understanding_critic, type: agent, skill: comp_understanding_critic, max_steps: 10, model: deepseek/deepseek-v4-flash }
  - id: eda_loop
    type: retry_loop
    max_iterations: 3
    action: { id: eda, type: agent, skill: eda, max_steps: 35 }
    check:  { id: eda_critic, type: agent, skill: eda_critic, max_steps: 10, model: deepseek/deepseek-v4-flash }

  # ---- baseline: build (deterministic pytest check), short-train, record ----
  - id: baseline_build
    type: retry_loop
    max_iterations: 3
    action: { id: build_baseline, type: agent, skill: build_baseline, max_steps: 45 }
    check:
      id: baseline_smoke
      type: command
      run: 'python3 -B -m pytest -q tests/ && echo "ACTION: pass" || echo "ACTION: fail"'
  - id: baseline_train_loop
    type: retry_loop
    max_iterations: 2
    action:
      id: baseline_train
      type: command
      run: 'python3 train.py --device {{ device }} --epochs {{ short_epochs }} --data-path data/ --checkpoint-dir checkpoints/ && python3 "{{ flow_dir }}/read_val_score.py"'
      set: { candidate_score: "VAL_SCORE=(\\S+)" }
    check: { id: baseline_verify, type: agent, skill: verify_training, max_steps: 12, model: deepseek/deepseek-v4-flash }
  - id: baseline_record
    type: command
    run: 'python3 "{{ flow_dir }}/keep_or_revert.py" --candidate {{ candidate_score }} --best nan --failures 0 --lower-is-better {{ lower_is_better }} --target "{{ target_score }}" --baseline true'
    set:
      best_score: "BEST_SCORE=(\\S+)"
      consecutive_failures: "FAILURES=([0-9]+)"
      target_met: "TARGET_MET=([01])"
  # one-time leakage + data-usage audit (P4); findings land in research_log.md
  # so every later propose/implement iteration sees them
  - { id: data_audit, type: agent, skill: data_audit, max_steps: 15 }

  # ---- hill-climb, MLE-STAR shape (arXiv:2506.15692): each outer PHASE runs
  # an ablation study that picks the highest-impact pipeline component, then
  # the inner loop refines ONLY that component for a few experiments. Same
  # total budget as the old flat loop (outer_phases × inner_iterations = 30),
  # but proposals are targeted instead of "change something".
  - id: hillclimb
    type: counting_loop
    max_iterations: "{{ outer_phases }}"
    exit_when: "consecutive_failures >= max_consecutive_failures or target_met == 1"
    body:
      - id: ablation
        type: agent
        skill: ablation
        max_steps: 35
        set: { target_block: "TARGET_BLOCK=(\\S+)" }
      - id: refine
        type: counting_loop
        max_iterations: "{{ inner_iterations }}"
        exit_when: "consecutive_failures >= max_consecutive_failures or target_met == 1"
        body:
          - id: propose_loop
            type: retry_loop
            max_iterations: 3
            action:
              id: propose
              type: agent
              skill: propose
              max_steps: 20
              set: { current_proposal: "(?s)(.+)" }
            check: { id: proposal_critic, type: agent, skill: proposal_critic, max_steps: 8, model: deepseek/deepseek-v4-flash }
          # one-paragraph digest of the accepted proposal -> proposals/summary.md, which
          # keep_or_revert writes into research_log.md (kept terse so the proposer can
          # re-read the whole log cheaply every iteration; the full proposal goes only
          # to experiments.jsonl for the human report)
          - { id: summarize, type: agent, skill: summarize, max_steps: 6, model: deepseek/deepseek-v4-flash }
          - id: implement_loop
            type: retry_loop
            max_iterations: 3
            action: { id: implement, type: agent, skill: implement_experiment, max_steps: 45 }
            check:
              id: implement_smoke
              type: command
              run: 'python3 -B -m pytest -q tests/ && echo "ACTION: pass" || echo "ACTION: fail"'
          # a failed train must read as nan (revert), never the previous score
          - id: reset_candidate
            type: command
            run: 'echo "CANDIDATE=nan"'
            set: { candidate_score: "CANDIDATE=(\\S+)" }
          - id: train_loop
            type: retry_loop
            max_iterations: 2
            action:
              id: train
              type: command
              run: 'python3 train.py --device {{ device }} --epochs {{ short_epochs }} --data-path data/ --checkpoint-dir checkpoints/ && python3 "{{ flow_dir }}/read_val_score.py"'
              set: { candidate_score: "VAL_SCORE=(\\S+)" }
            check: { id: verify_train, type: agent, skill: verify_training, max_steps: 12, model: deepseek/deepseek-v4-flash }
          - id: keep_or_revert
            type: command
            run: 'python3 "{{ flow_dir }}/keep_or_revert.py" --candidate {{ candidate_score }} --best {{ best_score }} --failures {{ consecutive_failures }} --lower-is-better {{ lower_is_better }} --target "{{ target_score }}"'
            set:
              best_score: "BEST_SCORE=(\\S+)"
              consecutive_failures: "FAILURES=([0-9]+)"
              target_met: "TARGET_MET=([01])"

  # ---- final training at the long budget, then submit ----
  - id: final_train_loop
    type: retry_loop
    max_iterations: 2
    action:
      id: final_train
      type: command
      run: 'python3 train.py --device {{ device }} --epochs {{ final_epochs }} --data-path data/ --checkpoint-dir checkpoints/ && python3 "{{ flow_dir }}/read_val_score.py"'
      set: { final_score: "VAL_SCORE=(\\S+)" }
    check: { id: final_verify, type: agent, skill: verify_training, max_steps: 12, model: deepseek/deepseek-v4-flash }

  # ---- self-ensemble on top of the trained solution (MLE-STAR P3-lite) ----
  # the agent builds one ensembling strategy (seeds/checkpoint-averaging/TTA)
  # and re-evaluates; the deterministic keep_or_revert then keeps it only if
  # eval_results.json actually improved on the final-train score — a failed
  # idea is reverted and the plain final model goes to submission instead.
  - { id: ensemble, type: agent, skill: ensemble, max_steps: 40 }
  - id: ensemble_eval
    type: command
    run: 'python3 "{{ flow_dir }}/read_val_score.py"'
    set: { candidate_score: "VAL_SCORE=(\\S+)" }
  - id: ensemble_keep
    type: command
    run: 'python3 "{{ flow_dir }}/keep_or_revert.py" --candidate {{ candidate_score }} --best {{ final_score }} --failures 0 --lower-is-better {{ lower_is_better }} --target "{{ target_score }}"'
    set: { final_score: "BEST_SCORE=(\\S+)" }
  - id: submission_loop
    type: retry_loop
    max_iterations: 3
    action: { id: make_submission, type: agent, skill: make_submission, max_steps: 30 }
    check:
      id: validate_submission
      type: command
      run: 'python3 "{{ flow_dir }}/validate_submission.py"'

  # ---- report + (optional, tolerant) grading ----
  # one LLM agent writes the whole self-contained report.html (outcome/winner prose,
  # per-experiment table, inline-SVG hill-climb chart); reads whatever upstream files
  # exist (no hardcoded schema). grade still runs after to capture the medal.
  - { id: report, type: agent, skill: report, max_steps: 25 }
  - id: grade
    type: command
    run: 'python3 "{{ flow_dir }}/grade.py" --comp {{ competition_id }} --data-dir "{{ mlebench_data_dir }}" || true'
    set:
      medal: "MEDAL=(\\S+)"
      test_score: "TEST_SCORE=(\\S+)"
      above_median: "ABOVE_MEDIAN=(\\S+)"
