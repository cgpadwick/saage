# Triage a GitHub issue against a working checkout: fetch the issue, locate
# the suspect code, build a repro that provably fails for the issue's reason,
# then write a triage report with a suggested (unapplied) fix.
#
# Run it FROM the target project's checkout — the workspace is your dev
# environment, so tests and imports already work (no clone, no install):
#   saage run flows/issue_triage/flow.yaml --workspace ~/code/project --set issue=1234
# Needs the `gh` CLI authenticated for the target repo. See README.md.

shared:
  issue: ""                       # REQUIRED: the issue number, via --set issue=N
  repro_exit: -1                  # engine-recorded exit of repro_saage.py (set by run_repro)

workflow:
  - id: fetch_issue
    type: command
    run: >
      gh issue view {{ issue }} --json number,title,body,comments
      > triage_issue.json 2> triage_fetch_err.txt
      || echo '{"error": "gh failed — see triage_fetch_err.txt"}'
      > triage_issue.json
    timeout: 60

  - id: locate
    type: agent
    skill: locate
    max_steps: 40

  # Each attempt: an agent writes repro_saage.py, then the ENGINE executes it
  # (a command step — the exit code and output are captured mechanically, not
  # reported by a model), and a read-only agent judges that evidence. A
  # fabricated "I ran it" can't happen: the run isn't the agent's to claim.
  - id: repro_loop
    type: retry_loop
    max_iterations: 3
    action:
      id: repro_attempt
      type: counting_loop
      max_iterations: 1
      body:
        - id: write_repro
          type: agent
          skill: write_repro
          max_steps: 40
        - id: run_repro
          type: command
          run: >
            PYTHONSAFEPATH=1 {{ python }} repro_saage.py
            > triage_repro_out.txt 2>&1;
            echo "REPRO_EXIT=$?"; head -c 2000 triage_repro_out.txt
          set:
            repro_exit: "REPRO_EXIT=(\\d+)"
          timeout: 300
    check:
      id: verify_repro
      type: agent
      skill: verify_repro

  - id: report_loop
    type: retry_loop
    max_iterations: 3
    action:
      id: report
      type: agent
      skill: report
      max_steps: 30
    check:
      id: check_report
      type: agent
      skill: check_report
